# Local stand-ins for RDS Proxy (Postgres) and ElastiCache (Redis).
#   docker compose up -d db redis   # dependencies only, run the app with `npm start`
#   docker compose up --build       # everything, including the app container
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todoadmin
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todoadmin -d todo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: todo
      DB_USER: todoadmin
      DB_PASSWORD: localdev
      DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      CACHE_TTL_SECONDS: 60
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db-data:
